<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ marca }}</title>
<style>
:root{
  --bg:#ffffff; --panel:#fafafa; --line:#e7e7e9; --line2:#f0f0f1;
  --tx:#18181b; --tx2:#52525b; --mut:#8e8e96;
  --ac:#15803d; --ac-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb;
  --dan:#b91c1c; --dan-bg:#fef2f2; --info:#1d4ed8;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums}

/* header */
header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:30}
.hd{max-width:1400px;margin:0 auto;padding:0 28px;height:56px;
  display:flex;align-items:center;gap:14px}
.hd h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.hd .dot{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.grow{flex:1}
.jobtx{font-size:13px;color:var(--warn);display:flex;align-items:center;gap:7px}
.spinner{width:12px;height:12px;border:2px solid #e5e5e5;border-top-color:var(--warn);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

main{max-width:1400px;margin:0 auto;padding:28px}

/* metricas */
.stats{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  margin-bottom:28px;background:var(--bg)}
.stat{flex:1;padding:16px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stat.warn .v{color:var(--warn)}
.stat.dan .v{color:var(--dan)}

/* secoes */
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);margin:0 0 10px}
section{margin-bottom:28px}

/* botoes */
button{font:inherit;font-size:13px;background:var(--bg);color:var(--tx);
  border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;
  transition:.12s}
button:hover:not(:disabled){background:var(--panel);border-color:#d4d4d8}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--tx);color:#fff;border-color:var(--tx)}
button.pri:hover:not(:disabled){background:#000}
button.mini{padding:3px 8px;font-size:12px;color:var(--tx2)}
button.dan{color:var(--dan)}
button.dan:hover:not(:disabled){background:var(--dan-bg);border-color:#fca5a5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* log */
.log{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:12px 14px;font:12px/1.7 ui-monospace,monospace;color:var(--tx2);
  max-height:150px;overflow:auto;white-space:pre-wrap;margin-top:12px}
.log:empty{display:none}

/* rodizio */
.seq{display:flex;flex-wrap:wrap;gap:6px}
.seq i{font-style:normal;font-size:12px;color:var(--tx2);background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.seq i b{color:var(--mut);font-weight:500;margin-right:4px}

/* abas */
nav.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  border-radius:0;padding:9px 0;color:var(--mut);font-size:13px;font-weight:500}
nav.tabs button:hover{background:none;color:var(--tx2)}
nav.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}

/* tabela */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;font-weight:600;color:var(--mut);
  text-transform:uppercase;letter-spacing:.05em;padding:0 12px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover td{background:#fcfcfd}
th.r,td.r{text-align:right}
.tit{font-weight:500;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mut);margin-top:1px}
.vazio{padding:40px;text-align:center;color:var(--mut);font-size:13px}

/* etiquetas discretas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:#c4c4c8}
.p-MENOR_PRECO:before{background:#dc2626}
.p-CUPOM:before{background:var(--ac)}
.p-DESCONTO_FORTE:before{background:#d97706}
.p-DESCONTO_LEVE:before{background:#2563eb}
.p-SEM_DESCONTO:before{background:#c4c4c8}
.bad{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500}
.b-ok{background:var(--ac-bg);color:var(--ac)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-dan{background:var(--dan-bg);color:var(--dan)}
.urg{font-size:11px;color:var(--dan);margin-top:2px}

/* campos */
input,select{font:inherit;font-size:13px;background:var(--bg);border:1px solid var(--line);
  color:var(--tx);border-radius:6px;padding:5px 8px}
input:focus,select:focus{outline:0;border-color:#a1a1aa}
select.plain{border-color:transparent;background:transparent;padding:3px 4px;
  margin-left:-4px;color:var(--tx2)}
select.plain:hover{border-color:var(--line);background:var(--bg)}
input.freq{width:62px;text-align:right}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
.hide{display:none}
.acts{display:flex;gap:5px;justify-content:flex-end}
</style></head>
<body>

<header><div class="hd">
  <span class="dot"></span>
  <h1>{{ marca }}</h1>
  <span class="grow"></span>
  <span id="jobTx" class="jobtx"></span>
  <button class="mini" onclick="carregar()">Atualizar</button>
</div></header>

<main>
  <div class="stats" id="stats"></div>

  <section>
    <p class="lbl">Ações</p>
    <div class="row">
      <button class="pri" onclick="acao('ciclo')">Publicar próximo</button>
      <button onclick="acao('vigia')">Varrer preços</button>
      <button onclick="acao('sincronizar')">Sincronizar lista</button>
      <button onclick="acao('descobrir')">Descobrir ofertas</button>
    </div>
    <div class="log" id="log"></div>
  </section>

  <section>
    <p class="lbl">Ordem de rodízio</p>
    <div class="seq" id="seq"></div>
  </section>

  <nav class="tabs">
    <button id="tb-prod" class="on" onclick="aba('prod')">Catálogo</button>
    <button id="tb-cup" onclick="aba('cup')">Cupons</button>
    <button id="tb-post" onclick="aba('post')">Publicações</button>
  </nav>

  <div id="ab-prod">
    <table><thead><tr>
      <th>Produto</th><th>Categoria</th><th>Situação</th><th class="r">Preço</th>
      <th class="r">Desc.</th><th class="r">Intervalo</th><th>Último</th><th>Link</th><th></th>
    </tr></thead><tbody id="tbProd"></tbody></table>
  </div>

  <div id="ab-cup" class="hide">
    <div class="form">
      <input id="cCode" placeholder="CÓDIGO" size="11">
      <select id="cTipo"><option value="perc">%</option><option value="fixo">R$</option></select>
      <input id="cValor" placeholder="valor" size="5" type="number">
      <input id="cMin" placeholder="mínimo" size="7" type="number">
      <input id="cTeto" placeholder="teto" size="6" type="number">
      <input id="cVal" type="date">
      <input id="cEsc" placeholder="GLOBAL ou MLB…" size="13">
      <button class="pri" onclick="addCupom()">Adicionar</button>
    </div>
    <table><thead><tr><th>Código</th><th>Regra</th><th>Escopo</th><th>Validade</th>
      <th>Situação</th><th></th></tr></thead><tbody id="tbCup"></tbody></table>
  </div>

  <div id="ab-post" class="hide">
    <table><thead><tr><th>Quando</th><th>Produto</th><th>Situação</th>
      <th class="r">Preço</th></tr></thead><tbody id="tbPost"></tbody></table>
  </div>
</main>

<script>
let D={};
const brl=v=>v==null?'—':'R$ '+Number(v).toFixed(2).replace('.',',');
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const cap=s=>(s||'').replace(/_/g,' ').toLowerCase().replace(/^./,c=>c.toUpperCase());

function aba(n){['prod','cup','post'].forEach(x=>{
  document.getElementById('ab-'+x).classList.toggle('hide',x!==n);
  document.getElementById('tb-'+x).classList.toggle('on',x===n);});}

async function carregar(){
  const D0=await fetch('/api/status'); D=await D0.json();
  const s=D.resumo;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="v">${s.total}</div><div class="l">Produtos</div></div>
    <div class="stat"><div class="v">${s.liberados}</div><div class="l">Prontos para publicar</div></div>
    <div class="stat ${s.urgentes?'warn':''}"><div class="v">${s.urgentes}</div><div class="l">Em queda de preço</div></div>
    <div class="stat"><div class="v">${s.posts_total}</div><div class="l">Publicados</div></div>
    <div class="stat ${s.sem_link_valido?'dan':''}"><div class="v">${s.sem_link_valido}</div><div class="l">Sem link confiável</div></div>`;

  document.getElementById('seq').innerHTML=D.rodizio.map((c,i)=>
    `<i><b>${i+1}</b>${c}</i>`).join('');

  const opts=D.categorias.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('tbProd').innerHTML=D.produtos.map(p=>`
    <tr>
      <td style="max-width:320px">
        <div class="tit">${esc(p.titulo).slice(0,58)||p.id}</div>
        <div class="sub mono">${p.id} · ${p.loja}</div></td>
      <td><select class="plain" onchange="setCat('${p.id}',this.value)">
        ${opts.replace('<option>'+p.categoria+'</option>','<option selected>'+p.categoria+'</option>')}
      </select></td>
      <td><span class="pill p-${p.tier}">${cap(p.tier)}</span>
        ${p.urgente?'<div class="urg">Queda detectada</div>':''}</td>
      <td class="r mono">${brl(p.preco)}</td>
      <td class="r mono">${p.desconto?p.desconto+'%':'—'}</td>
      <td class="r"><input class="freq mono" value="${p.freq}"
        onchange="setFreq('${p.id}',this.value)" title="minutos entre publicações"></td>
      <td>${p.liberado?'<span class="bad b-ok">livre</span>':
        '<span class="sub">há '+p.ultimo_post+'</span>'}</td>
      <td>${p.link?`<a href="${p.link}" target="_blank" class="bad ${
        p.link_sit==='ok'?'b-ok':p.link_sit==='aviso'?'b-warn':'b-dan'}">${p.link_tipo}</a>`
        :'<span class="bad b-dan">ausente</span>'}</td>
      <td><div class="acts">
        <button class="mini" onclick="prodAcao('${p.id}','postar')">Publicar</button>
        <button class="mini" onclick="prodAcao('${p.id}','pausar')">Pausar</button>
        <button class="mini dan" onclick="if(confirm('Remover ${p.id}?'))prodAcao('${p.id}','apagar')">Remover</button>
      </div></td>
    </tr>`).join('')||'<tr><td colspan="9" class="vazio">Catálogo vazio — sincronize sua lista para começar.</td></tr>';

  document.getElementById('tbCup').innerHTML=D.cupons.map(c=>`
    <tr><td class="mono tit">${c.code}</td><td>${c.regra}</td>
    <td class="mono sub">${c.escopo||'GLOBAL'}</td><td class="mono">${c.validade||'—'}</td>
    <td>${c.vencido?'<span class="bad b-dan">vencido</span>':'<span class="bad b-ok">válido</span>'}</td>
    <td class="r"><button class="mini dan" onclick="delCupom('${c.code}')">Remover</button></td></tr>`).join('')
    ||'<tr><td colspan="6" class="vazio">Nenhum cupom cadastrado.</td></tr>';

  document.getElementById('tbPost').innerHTML=D.posts.map(p=>`
    <tr><td class="sub">há ${p.quando}</td><td class="tit">${esc(p.title||p.product_id).slice(0,62)}</td>
    <td><span class="pill p-${p.tier}">${cap(p.tier)}</span></td>
    <td class="r mono">${brl(p.price)}</td></tr>`).join('')
    ||'<tr><td colspan="4" class="vazio">Nada publicado ainda.</td></tr>';

  mostraJob(D.job);
}

function mostraJob(j){
  document.getElementById('jobTx').innerHTML = j.rodando
    ? `<span class="spinner"></span>${j.nome}` : '';
  document.getElementById('log').textContent = (j.log||[]).join('\n');
  document.querySelectorAll('section .row button').forEach(b=>b.disabled=j.rodando);
}

async function acao(n){
  const body = n==='sincronizar' ? {url:prompt('URL da sua lista de afiliado:','')} : {};
  if(n==='sincronizar' && !body.url) return;
  await fetch('/api/acao/'+n,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  seguirJob();
}
function seguirJob(){
  const t=setInterval(async()=>{
    const j=await(await fetch('/api/job')).json();
    mostraJob(j);
    if(!j.rodando){clearInterval(t);carregar();}
  },1500);
}
async function prodAcao(id,a){
  await fetch(`/api/produto/${id}/${a}`,{method:'POST'});
  a==='postar'?seguirJob():carregar();
}
async function setFreq(id,v){
  await fetch(`/api/produto/${id}/frequencia`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({minutos:v})});carregar();}
async function setCat(id,v){
  await fetch(`/api/produto/${id}/categoria`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({categoria:v})});carregar();}
async function addCupom(){
  const g=i=>document.getElementById(i).value;
  if(!g('cCode'))return alert('Informe o código do cupom.');
  await fetch('/api/cupom',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:g('cCode'),tipo:g('cTipo'),valor:g('cValor'),minimo:g('cMin'),
      teto:g('cTeto'),validade:g('cVal'),escopo:g('cEsc')})});
  ['cCode','cValor','cMin','cTeto','cVal','cEsc'].forEach(i=>document.getElementById(i).value='');
  carregar();
}
async function delCupom(c){
  if(!confirm('Remover o cupom '+c+'?'))return;
  await fetch('/api/cupom/'+c,{method:'DELETE'});carregar();
}
carregar();setInterval(carregar,30000);
</script>
</body></html>
