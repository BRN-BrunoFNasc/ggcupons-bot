name: Testar leitura Amazon

# Teste manual: verifica se o GitHub Actions consegue ler uma pagina de produto
# da Amazon (preco/titulo). So imprime no log - nao grava nada, nao posta.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link do produto Amazon (deixe em branco para usar o exemplo)'
        required: false
        default: 'https://www.amazon.com.br/dp/B0GGLJCJQM'

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias + navegador
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Preparar configuracao
        run: cp ci.env .env

      - name: Testar leitura da Amazon
        env:
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
        run: python testar_amazon.py "${{ github.event.inputs.url }}"
